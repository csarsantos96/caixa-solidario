name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caixa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: caixa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caixa -d caixa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ADMIN_PASSWORD: ci-only-admin-password
      DATABASE_URL: postgresql+psycopg://caixa:ci-only-password@localhost:5432/caixa_ci
      TEST_DATABASE_URL: postgresql+psycopg://caixa:ci-only-password@localhost:5432/caixa_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test src/*.test.js
      - run: npm run build
